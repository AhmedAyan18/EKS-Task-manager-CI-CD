apiVersion: apps/v1

kind: Deployment

metadata:

  name: backend

  namespace: task-manager


spec:

  replicas: 2

  selector:

    matchLabels:

      app: backend


  template:

    metadata:

      labels:

        app: backend


    spec:

      containers:

        - name: backend

          image: 795445317757.dkr.ecr.eu-north-1.amazonaws.com/myapp-backend:latest

          ports:

            - containerPort: 5000


          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "500m"

              memory: "512Mi"


          readinessProbe:

            httpGet:

              path: /api/health

              port: 5000

            initialDelaySeconds: 5

            periodSeconds: 10


          livenessProbe:

            httpGet:

              path: /api/health

              port: 5000

            initialDelaySeconds: 15

            periodSeconds: 20